
.artifacts-template: &artifacts-template
  artifacts:
    name: "${CI_PROJECT_PATH}_${CI_JOB_STAGE}_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHA}"
    paths:
      - tor-android-binary/src/main/libs
      - external/include
      - external/lib
      - external/test
    expire_in: 1 year
    when: always

.apt-template: &apt-template |
      export LC_ALL=C.UTF-8
      echo Etc/UTC > /etc/timezone
      echo 'quiet "1";' \
           'APT::Install-Recommends "0";' \
           'APT::Install-Suggests "0";' \
           'APT::Acquire::Retries "20";' \
           'APT::Get::Assume-Yes "true";' \
           'Dpkg::Use-Pty "0";' \
        >> /etc/apt/apt.conf.d/99gitlab
      apt-get update
      apt-get dist-upgrade


.android-template: &android-template
  image: ubuntu:latest
  <<: *artifacts-template
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - *apt-template

    - apt-get -qy install
        autoconf
        autogen
        automake
        autopoint
        autotools-dev
        gettext-base
        git
        libtool
        make
        patch
        pkg-config
        ca-certificates 
        curl
        gzip
        libtinfo6
        pkg-config
        tar
        unzip
        wget

    - rm -rf $PWD/android-ndk*
    - ndk=android-ndk-`echo $CI_JOB_NAME | awk '{print $2}'`
    - ndk_zip=${ndk}-linux.zip
    - curl --fail --location --silent --show-error https://dl.google.com/android/repository/${ndk_zip} --output $ndk_zip
    - echo "a7b54a5de87fecd125a17d54f73c446199e72a64 $ndk_zip" > ${ndk_zip}.sha1
    - sha1sum -c ${ndk_zip}.sha1
    - unzip -q $ndk_zip
    - export ANDROID_NDK_HOME=`pwd`/$ndk

    - mkdir -p external
    - export EXTERNAL_ROOT=`pwd`/external
    - cd external

    - git clone --single-branch --branch openssl-3.6.5 https://github.com/openssl/openssl.git

    - git clone --single-branch --branch release-2.1.12-stable https://github.com/libevent/libevent.git

    - git clone --single-branch --branch v1.4.9 https://github.com/facebook/zstd.git

    - git clone --single-branch --branch v5.2.4 https://github.com/tukaani-project/xz.git

    - git clone --single-branch --branch prod-0.4.9 https://gitlab.torproject.org/Gedsh/tor.git


android r28c 21 default armeabi-v7a:
  <<: *android-template
  script:
    - APP_ABI=armeabi-v7a NDK_PLATFORM_LEVEL=21 make clean
    - APP_ABI=armeabi-v7a NDK_PLATFORM_LEVEL=21 make


android r28c 21 default arm64-v8a:
  <<: *android-template
  script:
    - APP_ABI=arm64 NDK_PLATFORM_LEVEL=21 make clean
    - APP_ABI=arm64 NDK_PLATFORM_LEVEL=21 make

android r28c 21 default x86_64:
  <<: *android-template
  script:
    - APP_ABI=x86_64 NDK_PLATFORM_LEVEL=21 make clean
    - APP_ABI=x86_64 NDK_PLATFORM_LEVEL=21 make
